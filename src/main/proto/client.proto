syntax = "proto3";

package raft.client;

option java_package = "com.fbtberger.raft.client.proto";
option java_multiple_files = true;

// The RPC contract external clients use to talk to the cluster. It is
// deliberately separate from raft.proto's RequestVote/AppendEntries, which
// are an internal server-to-server protocol: clients should never need to
// know those messages exist. A client only ever submits an opaque command
// and gets back an opaque result (or a redirect hint), so the same RPC can
// carry whatever a particular deployment's state machine understands --
// the KV "SET key value" commands in this repo's demo, or anything else.
//
// This mirrors how the paper (Section 8) describes client interaction:
// a client sends its command to what it believes is the leader; a server
// that isn't the leader rejects the request and, if it knows who the
// leader is, tells the client who to try instead.
service RaftClientService {
  rpc Submit(SubmitRequest) returns (SubmitResponse);

  // A linearizable read (§6.4). Like Submit it is leader-only, and for the same
  // reason: a follower can be arbitrarily far behind, and a partitioned-away one
  // may not even know it has been deposed. The leader confirms its leadership
  // with a ReadIndex barrier before the state machine is touched, so a Query
  // observes every command that committed before it was issued.
  //
  // The query bytes are opaque here exactly as command bytes are in Submit: what
  // they mean is the deployment's state machine's business.
  rpc Query(QueryRequest) returns (QueryResponse);

  // Cluster reconfiguration (§6): adds or removes one voting member at a
  // time. Like Submit, these only succeed against the leader; a non-leader
  // rejects the request and reports a leader_hint if it has one.
  rpc AddServer(AddServerRequest) returns (ReconfigurationResponse);
  rpc RemoveServer(RemoveServerRequest) returns (ReconfigurationResponse);

  // Non-voting learners (§4.2.1): AddLearner starts replicating to a new
  // server without adding it to the voting majority; PromoteLearner turns a
  // caught-up learner into a voting member; RemoveLearner drops one. Same
  // leader-only semantics as the reconfiguration RPCs above.
  rpc AddLearner(AddLearnerRequest) returns (ReconfigurationResponse);
  rpc PromoteLearner(PromoteLearnerRequest) returns (ReconfigurationResponse);
  rpc RemoveLearner(RemoveLearnerRequest) returns (ReconfigurationResponse);

  // Leadership transfer (§3.10): asks the leader to hand the lead to target_id
  // rather than waiting for it to fail. The membership does not change, so this
  // is not a reconfiguration -- but it is leader-only, refused with a leader
  // hint by anyone else, and refused with a reason worth reading by the leader,
  // which is every property the response below carries. A message of its own
  // would fork the client's leader-following walk without changing behaviour.
  //
  // Until this existed the operation was reachable only through the JMX MBean
  // (RaftNodeMXBean#transferLeadership), which means: not from an operator's
  // machine, and not on a host carrying only a JRE. RaftNode has been able to
  // do it since v125; nothing could ask.
  rpc TransferLeadership(TransferLeadershipRequest) returns (ReconfigurationResponse);
}

message SubmitRequest {
  bytes command = 1;
}

message SubmitResponse {
  bool success = 1;

  // Set iff success is true: the state machine's return value for this command.
  bytes result = 2;

  // Set iff success is false and this server knows who the current leader is;
  // clients should retry against this node id (resolved via their own copy of
  // the cluster's address book, e.g. RaftConfig.peerAddresses()).
  string leader_hint = 3;

  // Set iff success is false, for diagnostics / display to a human.
  string error = 4;
}

message QueryRequest {
  bytes query = 1;
}

message QueryResponse {
  bool success = 1;

  // Set iff success is true: the state machine's answer to this query.
  bytes result = 2;

  // Set iff success is false and this server knows who the current leader is.
  string leader_hint = 3;

  // Set iff success is false, for diagnostics / display to a human. A state
  // machine that serves no reads at all answers here rather than pretending.
  string error = 4;
}

message AddServerRequest {
  string id = 1;
  string address = 2; // host:port
}

message RemoveServerRequest {
  string id = 1;
}

message AddLearnerRequest {
  string id = 1;
  string address = 2; // host:port
}

message PromoteLearnerRequest {
  string id = 1;
}

message RemoveLearnerRequest {
  string id = 1;
}

message TransferLeadershipRequest {
  // Must already be a voting member: a leader cannot hand the lead to a server
  // that is not in the configuration, and a learner never stands for election.
  string target_id = 1;
}

message ReconfigurationResponse {
  bool success = 1;

  // Set iff success is false and this server knows who the current leader is.
  string leader_hint = 2;

  // Set iff success is false, for diagnostics / display to a human.
  string error = 3;
}
