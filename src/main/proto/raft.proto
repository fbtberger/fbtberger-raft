syntax = "proto3";

package raft;

option java_package = "com.fbtberger.raft.proto";
option java_outer_classname = "RaftProto";
option java_multiple_files = true;

// A cluster membership list (§6): every server this configuration considers
// a voting member, by id and gRPC address. Like a command, a configuration
// change is just a special kind of log entry, replicated the same way as
// everything else -- there is no separate mechanism for it.
//
// Joint consensus: when old_members is non-empty, the cluster is in a
// transitional phase (C_old,new) where decisions require separate
// majorities from BOTH old_members AND members. Once this entry commits,
// a second entry with only members (empty old_members) is proposed
// automatically to complete the transition to C_new.
message ClusterConfiguration {
  message Member {
    string id = 1;
    string address = 2; // host:port
  }
  repeated Member members = 1;
  repeated Member old_members = 2;
  // Non-voting learners (§4.2.1 of Ongaro's dissertation): servers the leader
  // replicates the log to but that do NOT count toward election or commit
  // majorities and are never solicited for (Pre)Votes. Their purpose is to let
  // a new server catch up its log before being promoted to a voting member, so
  // adding capacity never opens an availability gap. The learner set is carried
  // through every configuration entry -- including both joint-consensus phases
  // -- and is persisted inside snapshots, so it survives reconfiguration and
  // log compaction exactly like the voting membership does.
  repeated Member learners = 3;
}

// A command for one of the state machines a server runs beside its
// application state machine (StateMachineRegistry). The name decides who
// applies it; no other state machine ever sees the bytes.
message NamedCommand {
  string state_machine = 1;
  bytes command = 2;
}

// One entry in the replicated log (paper, Figure 2 / Figure 6): a command
// for the application state machine, a configuration change, or a command
// for a named state machine, plus the term in which the leader received it.
// Exactly one of the three is ever set; which one determines whether
// applyCommittedEntries() hands it to the application state machine, treats
// it as a membership change (§6), or hands it to the state machine it names.
//
// A server that predates named_command reads such an entry as an empty
// command for its application state machine. Upgrade every server before
// the first named command is submitted.
message LogEntry {
  int64 index = 1;
  int64 term = 2;
  oneof payload {
    bytes command = 3;
    ClusterConfiguration configuration = 4;
    NamedCommand named_command = 8;
  }

  // Client session tag (§8, dissertation §6.3). Empty client_id means the
  // command was submitted without a session and is applied unconditionally,
  // which is what every entry written before these fields existed reads as.
  //
  // With a client_id, (client_id, sequence) names the command: every server
  // applies it at most once and answers a repeat from its recorded result.
  // acked_sequence is the highest sequence up to which the client has received
  // every response, so the servers can drop the results they still hold for it.
  //
  // These travel in the log, not beside it, because the decision "is this a
  // duplicate" must come out the same on every server and survive a leader
  // change -- the retry that matters is precisely the one that reaches the
  // NEXT leader.
  string client_id = 5;
  int64 sequence = 6;
  int64 acked_sequence = 7;
}

// The replicated session table, as it is stored in a snapshot (§7). Order is
// significant: sessions are listed least recently used first, and eviction
// follows that order, so two servers restoring the same snapshot must evict
// the same session next.
message ClientSessionTable {
  repeated ClientSession sessions = 1;
  // Set in the snapshots a witness writes when it compacts its log. Such a snapshot
  // has no state in it, and a node that is not a witness must never start from one.
  bool witness = 2;
}

message ClientSession {
  string client_id = 1;
  // Every sequence at or below this has been acknowledged by the client; its
  // result is gone and a repeat of it is refused rather than re-applied.
  int64 acked_sequence = 2;
  repeated ClientSessionResult results = 3;
}

message ClientSessionResult {
  int64 sequence = 1;
  bytes result = 2;
}

// RequestVote RPC, invoked by candidates to gather votes (§5.2).
message RequestVoteRequest {
  int64 term = 1;
  string candidateId = 2;
  int64 lastLogIndex = 3;
  int64 lastLogTerm = 4;
  // v125: set only when the candidate was told to campaign by the incumbent
  // leader via TimeoutNow (§3.10). Leader stickiness (§4.2.3) makes every
  // healthy follower refuse a vote while it still hears from a leader -- which
  // is exactly what a leadership transfer needs them NOT to do, since the
  // leader is alive by construction. Voters skip the stickiness check when this
  // is set. Defaults to false, so an old peer that never sets it simply gets
  // the strict behaviour.
  bool leadershipTransfer = 5;
}

message RequestVoteResponse {
  int64 term = 1;
  bool voteGranted = 2;
}

// AppendEntries RPC, invoked by the leader to replicate log entries and,
// with an empty entries list, as a heartbeat (§5.3).
message AppendEntriesRequest {
  int64 term = 1;
  string leaderId = 2;
  int64 prevLogIndex = 3;
  int64 prevLogTerm = 4;
  repeated LogEntry entries = 5;
  int64 leaderCommit = 6;
}

message AppendEntriesResponse {
  int64 term = 1;
  bool success = 2;
  // v118: on a rejection, the follower's own last log index. The leader uses it to back
  // nextIndex/matchIndex down past a stale-high matchIndex — the case where a peer was wiped
  // (log truncated back) while the leader still held its pre-wipe match, which otherwise pins
  // nextIndex above snapshotIndex forever and the InstallSnapshot switch never fires. Unset (0)
  // on success. Also correct for a normal shorter follower; only advisory, never trusted upward.
  int64 conflictLastLogIndex = 3;
}

// InstallSnapshot RPC (§7, Figure 13), used by a leader instead of
// AppendEntries when a follower needs entries the leader has already
// compacted out of its own log. The snapshot is split into fixed-size
// chunks and sent one chunk per RPC; the follower reassembles them and
// applies the complete snapshot once the final chunk (done=true) arrives.
message InstallSnapshotRequest {
  int64 term = 1;
  string leaderId = 2;
  int64 lastIncludedIndex = 3;
  int64 lastIncludedTerm = 4;
  int64 offset = 5;   // byte offset where this chunk starts in the snapshot
  bytes data = 6;     // raw bytes of the snapshot chunk starting at offset
  bool done = 7;      // true if this is the last chunk
}

message InstallSnapshotResponse {
  int64 term = 1;
}

// PreVote RPC (§9.6 / §4.2.3): before starting a real election a
// candidate checks that a majority would grant the vote AND haven't
// heard from a valid leader recently. This prevents a partitioned
// server from inflating its term and disrupting the cluster on rejoin.
message PreVoteRequest {
  int64 term = 1;           // the term the candidate WOULD use (currentTerm + 1)
  string candidateId = 2;
  int64 lastLogIndex = 3;
  int64 lastLogTerm = 4;
}

message PreVoteResponse {
  int64 term = 1;
  bool voteGranted = 2;
}

// TimeoutNow RPC (§3.10): the leader sends this to a target server to
// trigger an immediate election, transferring leadership without waiting
// for an election timeout.
message TimeoutNowRequest {
  int64 term = 1;
  // The leader handing over. Until this existed TimeoutNow was the one peer RPC with no
  // sender in it, so it could neither be bound to the mTLS certificate nor checked against
  // the leader the receiver follows: any holder of a cluster certificate could make any
  // node start an election. Empty from a peer that predates the field; a server running
  // mTLS refuses that, a plaintext one accepts it as before.
  string leaderId = 2;
}

message TimeoutNowResponse {
  // Set by a witness: it has no state machine, so it does not take the lead on
  // request. The leader fails the transfer at once instead of waiting it out.
  bool witness = 1;
}

// ReadIndex RPC (dissertation §6.4, "followers can also help offload the
// processing of read-only queries"). A follower or learner that wants to answer
// a read itself asks the leader for the index the read must see. The leader
// confirms its leadership with a heartbeat round exactly as it does for its own
// reads and answers with that index; the requester waits until it has applied
// that far and then reads from its own state machine.
//
// The leader does the part only a leader can do and the follower does the part
// that costs: the read itself.
message ReadIndexRequest {
  // Who is asking. Bound to the certificate under mTLS like every sender id, and
  // refused unless it is a member or learner of the leader's configuration.
  string requester_id = 1;
}

message ReadIndexResponse {
  // False if this server is not the leader, lost the leadership while
  // confirming it, or does not know the requester.
  bool success = 1;
  // Set iff success: every command committed before the request arrived is at or
  // below this index.
  int64 read_index = 2;
  int64 term = 3;
  // Set iff not success and this server knows who the leader is.
  string leader_hint = 4;
}

service RaftService {
  rpc ReadIndex (ReadIndexRequest) returns (ReadIndexResponse);
  rpc RequestVote (RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries (AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot (InstallSnapshotRequest) returns (InstallSnapshotResponse);
  rpc PreVote (PreVoteRequest) returns (PreVoteResponse);
  rpc TimeoutNow (TimeoutNowRequest) returns (TimeoutNowResponse);
}
