# Local three-node demo cluster -- one machine, three JVMs, no Docker and no
# database. See scripts/demo-cluster.sh; the election switches are passed as -D
# by that script rather than set here, so one config file serves every run.
node.id=node2
node.port=9092
data.dir=.demo-cluster/data/node2

peer.node1=localhost:9091
peer.node2=localhost:9092
peer.node3=localhost:9093

# Small, so log compaction is observable without hundreds of commands.
snapshot.threshold=20

# Disabled: three nodes on one host would otherwise fight over the port.
metrics.port=0
