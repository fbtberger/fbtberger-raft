node.id=node1
node.port=9091
# The Raft log and the snapshots live under /var/raft inside the container
data.dir=/var/raft/node1

# Docker hostnames, not localhost: a peer address has to resolve from inside a container
peer.node1=kwatro-1:9091
peer.node2=kwatro-2:9092
peer.node3=kwatro-3:9093

# Kept small for a test environment, so log compaction is easy to watch happening.
# Production sets 300 (see the kwatro deployment); dev keeps 1000.
snapshot.threshold=20

# Prometheus metrics at http://<host>:10091/metrics
metrics.port=10091
