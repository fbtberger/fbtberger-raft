node.id=node1
node.port=9091
# Raft-Log und Snapshots werden im Container unter /var/raft gespeichert
data.dir=/var/raft/node1

# Docker-Hostnamen statt localhost
peer.node1=kwatro-1:9091
peer.node2=kwatro-2:9092
peer.node3=kwatro-3:9093

# Für Testumgebung klein halten, damit Log-Compaction leicht beobachtbar ist
snapshot.threshold=20

# Prometheus-Metriken unter http://<host>:10091/metrics
metrics.port=10091
