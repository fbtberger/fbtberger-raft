# For a client on the host, run from deploy/compose (the certificate paths are relative):
#
#   RAFT_KEYCLOAK_CLIENT_ID=raft-service RAFT_KEYCLOAK_CLIENT_SECRET=raft-service-dev-secret \
#     java -cp ../../build/libs/fbtberger-raft-1.0.0-all.jar \
#     com.fbtberger.raft.client.RaftClientDemo config/client.properties
#
# node.id, node.port and data.dir are required by the file format and not used by a client.
node.id=node1
node.port=9091
data.dir=unused

# The nodes as the host reaches them: the ports docker-compose.yml publishes.
peer.node1=localhost:9091
peer.node2=localhost:9092
peer.node3=localhost:9093

# The nodes require a client certificate on every connection (mTLS).
tls.enabled=true
tls.mtls.enabled=true
tls.cert.path=certs/client.crt
tls.key.path=certs/client.key
tls.ca.path=certs/ca.crt

# Where the access token comes from. The nodes accept tokens of exactly this issuer.
auth.keycloak.enabled=true
auth.keycloak.issuer=http://localhost:8080/realms/raft
