# Node 3 of the Docker Compose cluster. See ../docker-compose.yml and ../README.md.
node.id=node3
node.port=9093
data.dir=/var/raft/node3

# Compose service names: they resolve inside the cluster network.
peer.node1=raft-1:9091
peer.node2=raft-2:9092
peer.node3=raft-3:9093

# /metrics, /health and /ready. HTTPS, with the node certificate, because TLS is on.
metrics.port=10093

# Peer transport: mutual TLS. The certificate CN must be the node id (node3), because a
# peer's sender id is checked against it. ./certs.sh issues them that way.
tls.enabled=true
tls.mtls.enabled=true
tls.cert.path=/etc/raft/certs/node3.crt
tls.key.path=/etc/raft/certs/node3.key
tls.ca.path=/etc/raft/certs/ca.crt
# A renewed certificate (./certs.sh renew) is in use this many seconds later at most.
tls.reload.interval.seconds=10

# Client channel: a Keycloak access token on every call.
# The issuer is the name clients see Keycloak under (KC_HOSTNAME in docker-compose.yml);
# the keys are fetched over the cluster network.
auth.keycloak.enabled=true
auth.keycloak.issuer=http://localhost:8080/realms/raft
auth.keycloak.jwks.uri=http://keycloak:8080/realms/raft/protocol/openid-connect/certs

# Overload protection (defaults shown).
overload.max.pending.writes=5000
overload.max.pending.reads=5000

# Two data nodes and a witness instead of three data nodes: set this on ONE node,
# before its first start. See section 5.5 of docs/architecture.md.
# node.witness=true
