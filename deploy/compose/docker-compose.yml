# Three Raft nodes and Keycloak.
#
#   ./certs.sh                      once: CA, node and client certificates into ./certs
#   (cd ../.. && ./gradlew shadowJar)
#   docker compose up --build -d
#   docker compose ps               all four services "healthy"
#
# Peers talk mutual TLS. The client channel (same port) additionally wants a Keycloak
# access token. See README.md in this directory.

name: fbtberger-raft

x-raft-node: &raft-node
  build:
    context: ../..
    dockerfile: config/Dockerfile
  image: fbtberger-raft:local
  restart: unless-stopped
  depends_on:
    keycloak:
      condition: service_healthy
  networks: [raft]
  stop_grace_period: 20s

services:
  keycloak:
    # KEYCLOAK_IMAGE=keycloak/keycloak:26.0 takes the same image from Docker Hub.
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.0}
    command: ["start-dev", "--import-realm"]
    environment:
      # Development credentials. Change them, or better: point the nodes at your own Keycloak.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # The one name tokens are issued under, whoever asks. It must equal
      # auth.keycloak.issuer (without /realms/raft) in config/node*.properties.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/raft-realm.json:/opt/keycloak/data/import/raft-realm.json:ro
    ports:
      - "8080:8080"
    networks: [raft]
    healthcheck:
      # The image has neither curl nor wget.
      test:
        - CMD-SHELL
        - >
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  raft-1:
    <<: *raft-node
    hostname: raft-1
    environment:
      RAFT_CONFIG_PATH: /etc/raft/config/node1.properties
      JAVA_OPTS: -Draft.cli.enabled=false
    volumes:
      - ./config:/etc/raft/config:ro
      - ./certs:/etc/raft/certs:ro
      - raft-1-data:/var/raft
    ports:
      - "9091:9091"
      - "10091:10091"
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://localhost:10091/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  raft-2:
    <<: *raft-node
    hostname: raft-2
    environment:
      RAFT_CONFIG_PATH: /etc/raft/config/node2.properties
      JAVA_OPTS: -Draft.cli.enabled=false
    volumes:
      - ./config:/etc/raft/config:ro
      - ./certs:/etc/raft/certs:ro
      - raft-2-data:/var/raft
    ports:
      - "9092:9092"
      - "10092:10092"
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://localhost:10092/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  raft-3:
    <<: *raft-node
    hostname: raft-3
    environment:
      RAFT_CONFIG_PATH: /etc/raft/config/node3.properties
      JAVA_OPTS: -Draft.cli.enabled=false
    volumes:
      - ./config:/etc/raft/config:ro
      - ./certs:/etc/raft/certs:ro
      - raft-3-data:/var/raft
    ports:
      - "9093:9093"
      - "10093:10093"
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://localhost:10093/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  raft:

volumes:
  raft-1-data:
  raft-2-data:
  raft-3-data:
